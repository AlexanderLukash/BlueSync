[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "bluesync-audio"
version = "0.1.0"
description = "Automatic Bluetooth headphone audio sharing for PipeWire"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Alexander Lukash"}]

[project.scripts]
bluesync-audio = "bluesync.service:main"

[project.urls]
Homepage = "https://github.com/AlexanderLukash/BlueSync"
Issues = "https://github.com/AlexanderLukash/BlueSync/issues"

[tool.setuptools]
packages = ["bluesync"]
